spring.application.name=electronic-drafting-system

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=cms_core;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Schema do script cms_core_sqlserver_v2.sql tạo (constraint, trigger, view); Hibernate không được sửa schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.thymeleaf.cache=false

server.port=8080

# Cloudinary: ảnh / video đăng tải từ trình soạn bài. DB chỉ lưu secure_url trả về.
# Đặt biến môi trường CLOUDINARY_URL=cloudinary://<api_key>:<api_secret>@<cloud_name> (Dashboard > API Keys).
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.folder=cms-core/articles
# Ảnh tối đa 10MB, video tối đa 100MB (kiểm tra chi tiết trong CloudinaryMediaStorageService)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB

