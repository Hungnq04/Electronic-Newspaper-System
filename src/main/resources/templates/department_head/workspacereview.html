<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <th:block th:fragment="reviewWorkspace">
        <h1>Đang thẩm định bài số <span th:text="${articleId}">0</span></h1>
        <p>Phiên bản đang duyệt: v<span th:text="${version.label}">1.0</span></p>
        <p th:if="${version.changeSummary != null}">
            Ghi chú của Lead khi nộp: <b th:text="${version.changeSummary}">...</b>
        </p>
        <a th:href="@{/department-head/dashboard}">Quay lại trang tổng quan</a>

        <!-- Nội dung bài: tít, tít phụ, sapo, rồi thân bài theo đúng thứ tự phóng viên sắp xếp -->
        <article>
            <h2 th:text="${version.title}">Tít bài</h2>
            <h3 th:if="${version.subtitle != null and !#strings.isEmpty(version.subtitle)}"
                th:text="${version.subtitle}">Tít phụ</h3>
            <p><i th:text="${version.sapo}">Sapo</i></p>

            <!-- Thân bài = danh sách khối (ContentBlockDTO). th:switch giống switch trong Java:
                 tùy loại khối (kind) mà in ra thẻ khác nhau -->
            <th:block th:each="block : ${version.blocks}" th:switch="${block.kind.name()}">
                <!-- Đoạn chữ: th:utext in HTML để giữ in đậm / nghiêng
                     (an toàn vì mapper đã lọc, chỉ giữ thẻ định dạng chữ) -->
                <p th:case="'TEXT'" th:utext="${block.html}">Đoạn chữ</p>
                <!-- Ảnh + chú thích -->
                <figure th:case="'IMAGE'">
                    <img th:src="${block.url}" style="max-width: 100%;" alt="">
                    <figcaption th:if="${block.caption != null}" th:text="${block.caption}">Chú thích</figcaption>
                </figure>
                <!-- Video + chú thích -->
                <figure th:case="'VIDEO'">
                    <video th:src="${block.url}" controls style="max-width: 100%;"></video>
                    <figcaption th:if="${block.caption != null}" th:text="${block.caption}">Chú thích</figcaption>
                </figure>
                <!-- Bảng: in nguyên HTML bảng (mapper đã lọc) -->
                <div th:case="'TABLE'" th:utext="${block.html}">Bảng</div>
            </th:block>
        </article>

        <!-- Danh sách góp ý của lượt duyệt đang mở -->
        <h3>Góp ý</h3>
        <p th:if="${#lists.isEmpty(comments)}">Chưa có góp ý nào.</p>
        <div th:each="comment : ${comments}">
            <span th:text="${comment.content}">Nội dung</span>
            <small th:text="'— ' + ${comment.authorName}">Người viết</small>
        </div>

        <!-- Form thêm góp ý chung cho cả bài -->
        <form method="post" th:action="@{/department-head/articles/{id}/comments(id=${articleId})}">
            <textarea name="content" required placeholder="Nội dung góp ý..."></textarea>
            <button type="submit">Thêm góp ý</button>
        </form>
        <!--form để duyệt bài-->
        <form method="post" th:action="@{/department-head/articles/{id}/approve(id=${articleId})}">
            <label>Ghi chú (không bắt buộc)</label>
            <textarea name="feedback"></textarea>
            <button type="submit">Duyệt, chuyển Thư ký</button>
        </form>
        <!--form để yêu cầu sửa bài-->
        <form method="post" th:action="@{/department-head/articles/{id}/request-revision(id=${articleId})}">
            <label>Nhận xét (bắt buộc)</label>
            <textarea name="feedback" required></textarea>
            <button type="submit">Yêu cầu sửa</button>
        </form>
    </th:block>
</body>

</html>
