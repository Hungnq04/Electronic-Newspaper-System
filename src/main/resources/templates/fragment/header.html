<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Header chung cho mọi role, layout/app.html tự gắn vào đầu mọi trang (màn riêng KHÔNG tự thêm header nữa).
  Dữ liệu do CurrentUserAdvice đưa vào model:
    user  - CurrentUserDTO (fullName, subtitle, initials)
    today - ngày hôm nay, vd "Thứ Sáu, 30/10/2026"
  Style: .ui-topbar trong static/css/theme.css
-->
<header class="ui-topbar" th:fragment="header(user, today)">
    <span class="ui-topbar-date" th:text="${today}">Thứ Sáu, 30/10/2026</span>
    <div class="ui-account">
        <span class="ui-avatar" th:text="${user.initials()}">TH</span>
        <div class="ui-account-copy">
            <strong th:text="${user.fullName()}">Nguyễn Thu Hà</strong>
            <small th:text="${user.subtitle()}">Phóng viên · Ban Thời sự</small>
        </div>
    </div>
</header>
</body>
</html>
