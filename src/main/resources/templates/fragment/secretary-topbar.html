<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Thanh trên cùng của các màn Thư ký tòa soạn (và Admin).
  Đồng bộ với thanh trên cùng của màn "Duyệt đề tài cuối" (tpTopbar trong reporter/topic-proposal-list.html):
  bên trái là tên hệ thống, bên phải là avatar + tên + vai trò. Không có ô tìm kiếm và chuông thông báo (chưa dùng).
  CSS nằm trong static/css/secretary.css (.sec-topbar).
  Tham số (do SecretaryHeaderAdvice đưa vào model):
    fullName, role, initials - tên, vai trò, chữ viết tắt trên avatar của người đăng nhập
-->
<header th:fragment="topbar(fullName, role, initials)" class="rp-topbar sec-topbar">
    <div class="sec-topbar-brand">
        <!-- Icon tờ báo, giống icon tp-icon-news của màn Duyệt đề tài cuối -->
        <svg class="rp-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 13h8M8 16h5"/></svg>
        <span>Hệ Thống Tòa Soạn Số</span>
    </div>
    <div class="rp-topbar-right">
        <span class="rp-topbar-divider"></span>
        <div class="rp-account">
            <span class="rp-avatar" th:text="${initials}">LC</span>
            <div class="rp-account-copy">
                <strong th:text="${fullName}">Lê Minh Châu</strong>
                <small th:text="${role}">Thư ký tòa soạn</small>
            </div>
        </div>
    </div>
</header>
</body>
</html>
