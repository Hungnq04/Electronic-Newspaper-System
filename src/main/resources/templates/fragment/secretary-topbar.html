<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Thanh trên cùng của các màn Thư ký tòa soạn. Cùng cấu trúc và class rp- với thanh dhTopbar của Trưởng ban
  (department_head/dashboard.html) để giao diện đồng bộ; CSS nằm trong static/css/secretary.css (.sec-topbar).
  Tham số (do SecretaryHeaderAdvice đưa vào model):
    fullName, role, initials - tên, vai trò, chữ viết tắt trên avatar của người đăng nhập
  Ô tìm kiếm và nút chuông hiện chỉ để hiển thị (chưa có chức năng).
-->
<header th:fragment="topbar(fullName, role, initials)" class="rp-topbar sec-topbar">
    <label class="rp-global-search">
        <svg class="rp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4.5 4.5"/></svg>
        <input type="search" placeholder="Tìm nhanh bản thảo, đề tài, phóng viên…" aria-label="Tìm nhanh" disabled>
    </label>
    <div class="rp-topbar-right">
        <button class="rp-icon-button" type="button" aria-label="Thông báo">
            <svg class="rp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
        </button>
        <span class="rp-topbar-divider"></span>
        <div class="rp-account">
            <span class="rp-avatar" th:text="${initials}">LC</span>
            <div class="rp-account-copy">
                <strong th:text="${fullName}">Lê Minh Châu</strong>
                <small th:text="${role}">Thư ký tòa soạn</small>
            </div>
        </div>
    </div>
</header>
</body>
</html>
