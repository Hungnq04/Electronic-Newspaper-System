<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Reusable sidebar fragment.
  Expected group fields: title, items
  Expected item fields: label, href, icon, count (optional)
-->
<aside class="app-sidebar"
       th:fragment="sidebar(brandMark, brandName, brandSubtitle, brandHref, groups, activePath, footerLabel, footerTime, footerDescription)"
       aria-label="Điều hướng chính">

    <div class="sidebar-header">
        <a class="sidebar-brand" th:href="${brandHref != null ? brandHref : '/'}">
            <span class="sidebar-brand-mark" th:text="${brandMark ?: 'T'}">T</span>
            <span class="sidebar-brand-copy">
                <span class="sidebar-brand-name" th:text="${brandName ?: 'TÒA SOẠN SỐ'}">TÒA SOẠN SỐ</span>
                <span class="sidebar-brand-subtitle" th:text="${brandSubtitle ?: 'HỆ THỐNG XUẤT BẢN SỐ'}">HỆ THỐNG XUẤT BẢN SỐ</span>
            </span>
        </a>
        <button class="sidebar-toggle" type="button" data-sidebar-toggle
                aria-label="Thu gọn thanh bên" aria-expanded="true"
                aria-controls="sidebar-nav" title="Thu gọn thanh bên">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6"/>
            </svg>
        </button>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav" aria-label="Menu hệ thống">
        <section class="sidebar-group" th:each="group : ${groups}">
            <h2 class="sidebar-group-title"
                th:if="${group.title != null and !#strings.isEmpty(group.title)}"
                th:text="${group.title}">PHÂN BAN TIN TỨC</h2>

            <a class="sidebar-link"
               th:each="item : ${group.items}"
               th:href="${item.href}"
               th:classappend="${activePath != null and activePath == item.href} ? ' is-active' : ''"
               th:attr="aria-current=${activePath != null and activePath == item.href} ? 'page' : null,
                        data-sidebar-label=${item.label}">
                <span class="sidebar-link-icon" aria-hidden="true">
                    <svg th:if="${item.icon == 'edit'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/><path d="M4 4h7"/><path d="M4 8h5"/></svg>
                    <svg th:if="${item.icon == 'clipboard-check'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6a1.5 1.5 0 0 0-1.5-1.5h-3A1.5 1.5 0 0 0 9 4.5Z"/><path d="m8.5 13 2.2 2.2 4.8-4.8"/></svg>
                    <svg th:if="${item.icon == 'folder-image'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5Z"/><rect x="7" y="11" width="10" height="6.5" rx=".8"/><circle cx="10" cy="13" r=".8"/><path d="m8 17 2.5-2 2 1.5 1.5-1 1 1.5"/></svg>
                    <svg th:if="${item.icon == 'shapes'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 4 7H8Z"/><rect x="3.5" y="14" width="6" height="6" rx="1"/><circle cx="17.5" cy="17" r="3"/></svg>
                    <svg th:if="${item.icon == 'file-text'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>
                    <svg th:if="${item.icon == 'users'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <svg th:if="${item.icon == 'settings'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a7.8 7.8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a7.8 7.8 0 0 1-1.5-.9l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.6a7.8 7.8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a7.8 7.8 0 0 1 1.5.9l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8Z" transform="translate(-1 -1) scale(1.08)"/></svg>
                    <svg th:if="${item.icon == null or (item.icon != 'edit' and item.icon != 'clipboard-check' and item.icon != 'folder-image' and item.icon != 'shapes' and item.icon != 'file-text' and item.icon != 'users' and item.icon != 'settings')}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 1.5"/></svg>
                </span>
                <span class="sidebar-link-label" th:text="${item.label}">Bài viết đang soạn</span>
                <span class="sidebar-link-count"
                      th:if="${item.count != null}"
                      th:text="${item.count}">3</span>
            </a>
        </section>
    </nav>

    <div class="sidebar-footer" th:if="${footerLabel != null or footerTime != null or footerDescription != null}">
        <div class="sidebar-footer-top">
            <span class="sidebar-status-dot" aria-hidden="true"></span>
            <span class="sidebar-footer-label" th:text="${footerLabel ?: 'HẠN NỘP BẢN TIN'}">HẠN NỘP BẢN TIN</span>
            <time class="sidebar-footer-time" th:if="${footerTime != null}" th:text="${footerTime}">17:30</time>
        </div>
        <p class="sidebar-footer-description"
           th:if="${footerDescription != null}"
           th:text="${footerDescription}">Số báo phát hành chiều</p>
    </div>

    <!-- Logout (FL-01): mọi màn trong layout chung đều có. POST /logout kèm CSRF; xong về pop-up Login. -->
    <form class="sidebar-logout" th:action="@{/logout}" method="post"
          onsubmit="return confirm('Bạn có chắc muốn đăng xuất?');">
        <button type="submit" class="sidebar-link sidebar-logout-button" data-sidebar-label="Đăng xuất" title="Đăng xuất">
            <span class="sidebar-link-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            </span>
            <span class="sidebar-link-label">Đăng xuất</span>
        </button>
    </form>
</aside>
</body>
</html>
