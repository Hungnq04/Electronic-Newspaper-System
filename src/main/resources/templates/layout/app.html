<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
  Layout chung cho mọi quyền: sidebar bên trái + nội dung bên phải.
  Controller truyền vào model:
    pageTitle       - tiêu đề tab trình duyệt
    contentView     - template chứa nội dung, vd "department_head/dashboard"
    contentFragment - tên th:fragment trong template đó, vd "departmentHeadContent"
    pageCss, pageJs - (tuỳ chọn) danh sách file CSS/JS riêng của trang
  sidebarGroups và activePath do SidebarAdvice tự thêm.
  headerUser và headerToday do CurrentUserAdvice tự thêm -> header chung gắn ở đây, màn riêng KHÔNG tự thêm header.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Cho các trang gọi fetch POST (vd. tự động lưu nháp) -->
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${pageTitle} ?: 'CMS Core'">CMS Core</title>
    <!-- Phông: Inter (chữ thường), Noto Serif (tiêu đề trang), Newsreader (màn workspace); đều hỗ trợ tiếng Việt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400..800&family=Noto+Serif:wght@400;600;700&display=swap">
    <!-- Giao diện chung cho mọi role (biến màu + class ui-), nạp trước CSS riêng của trang -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/department-head-header.css}">
    <link rel="stylesheet" th:each="css : ${pageCss}" th:href="@{${css}}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragment/sidebar :: sidebar(null, null, null, '/', ${sidebarGroups}, ${activePath}, null, null, null)}"></aside>
    <div class="app-content">
        <!-- Header chung: tên, vai trò · phòng ban, avatar của người đang đăng nhập -->
        <th:block th:if="${headerUser != null}">
            <header th:replace="~{fragment/header :: header(${headerUser}, ${headerToday})}"></header>
        </th:block>
        <th:block th:replace="~{__${contentView}__ :: __${contentFragment}__}"></th:block>
    </div>
</div>
<script th:src="@{/js/sidebar.js}"></script>
<script th:each="js : ${pageJs}" th:src="@{${js}}"></script>
</body>
</html>
