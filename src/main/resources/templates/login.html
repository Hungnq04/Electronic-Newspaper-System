<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- Pop-up Login (FL-01): dùng chung cho mọi vai trò. Chỉ là giao diện; xử lý đăng nhập vẫn ở AuthController (POST /login). -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | CMS Core</title>
    <link rel="stylesheet" th:href="@{/css/login-popup.css}">
</head>
<body class="lp-body">
<!-- Nền phía sau pop-up -->
<div class="lp-backdrop" aria-hidden="true">
    <div class="lp-backdrop-brand">
        <span class="lp-mark">T</span>
        <span class="lp-backdrop-copy"><strong>TÒA SOẠN</strong><small>HỆ THỐNG XUẤT BẢN SỐ</small></span>
    </div>
</div>

<div class="lp-overlay">
    <main class="lp-dialog" role="dialog" aria-modal="true" aria-labelledby="lp-title" aria-describedby="lp-desc">
        <header class="lp-head">
            <span class="lp-mark lp-mark--sm" aria-hidden="true">T</span>
            <div>
                <h1 id="lp-title">Đăng nhập</h1>
                <p id="lp-desc">Hệ thống Tòa soạn Điện tử</p>
            </div>
        </header>

        <p class="lp-alert lp-alert--error" role="alert" th:if="${error}" th:text="${error}">Email hoặc mật khẩu không đúng.</p>
        <p class="lp-alert lp-alert--ok" role="status" th:if="${message}" th:text="${message}">Bạn đã đăng xuất.</p>

        <form class="lp-form" method="post" th:action="@{/login}" data-lp-form>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="username" autofocus placeholder="ten@cmscore.example">

            <label for="password">Mật khẩu</label>
            <div class="lp-password">
                <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Nhập mật khẩu">
                <button type="button" class="lp-toggle" data-lp-toggle aria-controls="password" aria-pressed="false">Hiện</button>
            </div>

            <button type="submit" class="lp-submit" data-lp-submit>Đăng nhập</button>
        </form>

        <div class="lp-divider"><span>hoặc</span></div>
        <a class="lp-google" href="/oauth2/authorization/google">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8Z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1-3.7 1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8l3.7-2.8Z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4Z"/></svg>
            Đăng nhập bằng Google
        </a>
        <p class="lp-links">Chưa có tài khoản? <a href="/register">Đăng ký</a></p>
    </main>
</div>

<script>
    // Hiện / ẩn mật khẩu; khóa nút sau khi bấm để tránh gửi trùng
    (function () {
        var input = document.getElementById('password');
        var toggle = document.querySelector('[data-lp-toggle]');
        toggle.addEventListener('click', function () {
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            toggle.textContent = show ? 'Ẩn' : 'Hiện';
            toggle.setAttribute('aria-pressed', String(show));
        });
        document.querySelector('[data-lp-form]').addEventListener('submit', function () {
            var submit = document.querySelector('[data-lp-submit]');
            submit.disabled = true;
            submit.textContent = 'Đang đăng nhập…';
        });
    })();
</script>
</body>
</html>
