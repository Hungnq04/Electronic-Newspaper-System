<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Create Topic Proposal + Submit Topic Confirmation (modal) -->
<th:block th:fragment="topicProposalCreateContent">
    <svg th:replace="~{reporter/topic-proposal-list :: tpSprite}"></svg>

    <div class="tp-page">
        <header th:replace="~{reporter/topic-proposal-list :: tpTopbar(${list})}"></header>

        <main class="tp-main">
            <div class="tp-heading-row">
                <div class="tp-heading">
                    <nav class="tp-breadcrumb" aria-label="Breadcrumb">
                        <a th:href="@{/reporter/topics}">ĐỀ TÀI</a><svg class="tp-icon tp-icon--tiny"><use href="#tp-icon-chevron-right"></use></svg>
                        <strong th:text="${editTopicId == null} ? 'Đề xuất mới' : 'Sửa & gửi lại'">Đề xuất mới</strong>
                    </nav>
                    <h1 th:text="${editTopicId == null} ? 'Đề xuất đề tài mới' : 'Sửa & gửi lại đề tài'">Đề xuất đề tài mới</h1>
                </div>
                <div class="tp-heading-actions">
                    <a class="tp-button tp-button--outline" th:href="@{/reporter/topics}">
                        <svg class="tp-icon"><use href="#tp-icon-arrow-left"></use></svg> Danh sách đề tài
                    </a>
                </div>
            </div>

            <!-- Chế độ sửa: hiện góp ý yêu cầu sửa gần nhất của Trưởng ban -->
            <div class="tp-feedback-box" th:if="${latestFeedback != null}">
                <strong>Góp ý của Trưởng ban</strong>
                <span class="tp-feedback-meta" th:text="${latestFeedback.authorName()} + ' · ' + ${#temporals.format(latestFeedback.createdAt(), 'dd/MM/yyyy HH:mm')}"></span>
                <p th:text="${latestFeedback.content()}">Nội dung góp ý</p>
            </div>

            <div class="tp-flash tp-flash--error" role="alert" th:if="${error}" th:text="${error}">Lỗi</div>

            <!-- novalidate: dùng thông báo lỗi tiếng Việt của trang (JS) và của server thay cho bong bóng mặc định -->
            <form class="tp-card tp-form" method="post" th:action="${editTopicId == null} ? @{/reporter/topics} : @{/reporter/topics/{id}/resubmit(id=${editTopicId})}" th:object="${topicForm}" novalidate data-tp-form>
                <div class="tp-field" th:classappend="${#fields.hasErrors('title')} ? 'has-error'" data-tp-field="title">
                    <div class="tp-label-row">
                        <label for="title">Tiêu đề đề tài <span class="tp-required">*</span></label>
                        <span class="tp-counter"><span data-tp-count="title">0</span> / <span th:text="${titleMax}">255</span> ký tự</span>
                    </div>
                    <input id="title" type="text" th:field="*{title}" th:maxlength="${titleMax}" required
                           placeholder="Ví dụ: Áp lực nợ xấu bất động sản thương mại cuối năm 2026"
                           aria-describedby="title-error">
                    <p class="tp-error" id="title-error" data-tp-error="title" th:errors="*{title}" th:if="${#fields.hasErrors('title')}">Vui lòng nhập tiêu đề đề tài.</p>
                </div>

                <!-- Phóng viên chỉ đề xuất cho ban của mình: hiện ban dạng chỉ đọc, không cho chọn -->
                <div class="tp-field">
                    <div class="tp-label-row">
                        <span class="tp-label">Ban phụ trách</span>
                    </div>
                    <p class="tp-readonly" data-tp-department-name
                       th:text="${myDepartment != null} ? ${myDepartment.name()} : 'Bạn chưa được gán ban. Vui lòng liên hệ Quản trị viên.'">Ban Kinh tế</p>
                </div>

                <div class="tp-field" th:classappend="${#fields.hasErrors('summary')} ? 'has-error'" data-tp-field="summary">
                    <div class="tp-label-row">
                        <label for="summary">Tóm tắt nội dung <span class="tp-required">*</span></label>
                        <span class="tp-counter"><span data-tp-count="summary">0</span> / <span th:text="${summaryMax}">4000</span> ký tự</span>
                    </div>
                    <textarea id="summary" rows="7" th:field="*{summary}" th:maxlength="${summaryMax}" required
                              placeholder="Bối cảnh, nhân vật dự kiến phỏng vấn, dữ liệu sẽ khai thác…"
                              aria-describedby="summary-error"></textarea>
                    <p class="tp-error" id="summary-error" data-tp-error="summary" th:errors="*{summary}" th:if="${#fields.hasErrors('summary')}">Vui lòng nhập tóm tắt nội dung.</p>
                </div>

                <div class="tp-form-actions">
                    <a class="tp-button tp-button--ghost" th:href="@{/reporter/topics}">
                        <svg class="tp-icon"><use href="#tp-icon-x"></use></svg> Hủy
                    </a>
                    <!-- type=button: chỉ mở modal xác nhận; form chỉ được gửi khi bấm "Xác nhận gửi" -->
                    <button type="button" class="tp-button tp-button--primary" data-tp-open-confirm>
                        <svg class="tp-icon"><use href="#tp-icon-send"></use></svg>
                        <span th:text="${editTopicId == null} ? 'Gửi duyệt' : 'Gửi lại'">Gửi duyệt</span>
                    </button>
                </div>
            </form>
        </main>

        <!-- Submit Topic Confirmation -->
        <div class="tp-modal-backdrop" hidden data-tp-confirm>
            <div class="tp-modal" role="dialog" aria-modal="true" aria-labelledby="tp-confirm-title">
                <h2 id="tp-confirm-title" th:text="${editTopicId == null} ? 'Xác nhận gửi đề tài' : 'Xác nhận gửi lại đề tài'">Xác nhận gửi đề tài</h2>
                <dl class="tp-confirm-summary">
                    <div><dt>Tiêu đề</dt><dd data-tp-confirm-title></dd></div>
                    <div><dt>Ban phụ trách</dt><dd data-tp-confirm-department></dd></div>
                </dl>
                <div class="tp-modal-actions">
                    <button type="button" class="tp-button tp-button--ghost" data-tp-cancel-confirm>Hủy, quay lại chỉnh sửa</button>
                    <button type="button" class="tp-button tp-button--primary" data-tp-submit-confirm>
                        <svg class="tp-icon"><use href="#tp-icon-send"></use></svg> Xác nhận gửi
                    </button>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
