<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- FL-07 Màn #67 Scheduled Publication List: bài đã hẹn giờ (SCHEDULED), chờ hệ thống tự đăng -->
<th:block th:fragment="content">
<main class="page">
    <div class="page-head">
        <div>
            <h1>Đã hẹn giờ đăng</h1>
            <p>Đến giờ, hệ thống tự đăng bài. Trước giờ đăng, có thể mở bài để hủy lịch và trả về Lead Reporter.</p>
        </div>
        <span class="badge badge-info" th:text="${#lists.size(items)} + ' bài đã hẹn giờ'"></span>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <section class="card">
        <div class="empty" th:if="${#lists.isEmpty(items)}">Hiện không có bài nào đang hẹn giờ đăng.</div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(items)}">
            <table class="data">
                <thead>
                <tr>
                    <th>Bài viết</th>
                    <th>Lead Reporter</th>
                    <th>Phiên bản sẽ đăng</th>
                    <th>Giờ đăng</th>
                    <th>Người đặt lịch</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <td class="title-cell">
                        <a th:href="@{/secretary/scheduled-publications/{id}(id=${item.articleId})}" th:text="${item.title}"></a>
                        <span class="sub"><span th:text="${item.topicTitle}"></span> · <span th:text="${item.category}"></span></span>
                    </td>
                    <td th:text="${item.leadName}"></td>
                    <td th:text="'v' + ${item.versionLabel}"></td>
                    <td>
                        <span th:text="${#temporals.format(item.scheduledAt, 'HH:mm, dd/MM/yyyy')}"></span>
                        <span class="sub" th:if="${item.due}">Đã đến giờ, đang chờ hệ thống đăng</span>
                    </td>
                    <td th:text="${item.scheduledBy}"></td>
                    <td>
                        <a class="btn btn-sm btn-ghost" th:href="@{/secretary/scheduled-publications/{id}(id=${item.articleId})}">Xem</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</th:block>
</body>
</html>
