<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác thực OTP</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="card">
    <h1>Xác thực email</h1>
    <p class="hint">Nhập mã OTP 6 chữ số đã gửi tới <strong th:text="${email}"></strong>.</p>
    <p class="err" th:if="${error}" th:text="${error}"></p>
    <p class="msg" th:if="${message}" th:text="${message}"></p>
    <form method="post" th:action="@{/register/verify}">
        <input type="hidden" name="email" th:value="${email}">
        <label for="otp">Mã OTP</label>
        <input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus>
        <button type="submit">Xác thực và hoàn tất đăng ký</button>
    </form>
    <p class="hint" id="otp-countdown" role="status" aria-live="polite"></p>
    <form method="post" th:action="@{/register/resend-otp}">
        <input type="hidden" name="email" th:value="${email}">
        <button id="resend-otp" type="submit">Gửi lại OTP</button>
    </form>
    <p class="links"><a href="/register">Quay lại đăng ký</a></p>
</main>
<script th:inline="javascript">
    (() => {
        let remaining = /*[[${otpRemainingSeconds}]]*/ 0;
        const countdown = document.getElementById('otp-countdown');
        const updateCountdown = () => {
            if (remaining <= 0) {
                countdown.textContent = 'Mã OTP đã hết hạn. Bạn có thể xác thực bằng mã mới hoặc yêu cầu gửi lại.';
                return;
            }
            countdown.textContent = `Mã OTP hiện tại còn hiệu lực ${remaining} giây. Bạn có thể gửi mã mới bất cứ lúc nào.`;
            remaining -= 1;
            window.setTimeout(updateCountdown, 1000);
        };

        updateCountdown();
    })();
</script>
</body>
</html>
